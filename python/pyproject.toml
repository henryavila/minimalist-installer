[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "minimalist-installer"
version = "0.1.0"
description = "A reversible, userland installer engine for Python applications"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Henry Avila", email = "personal@henryavila.com" },
]
keywords = [
  "installer",
  "reversible",
  "ai-skills",
  "userland",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
tui = [
  "questionary>=2",
  "rich>=13",
]
dev = [
  "build>=1",
  "hypothesis>=6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
minimalist-installer = "minimalist_installer.cli:main"

[project.urls]
Homepage = "https://github.com/henryavila/minimalist-installer"
Issues = "https://github.com/henryavila/minimalist-installer/issues"
Repository = "https://github.com/henryavila/minimalist-installer.git"

[tool.hatch.build.targets.wheel]
packages = ["src/minimalist_installer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
