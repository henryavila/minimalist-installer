name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node >= 21 — the test script uses node's recursive `--test` glob.
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install -U pip
          python -m pip install -e "./python[dev,tui]"
      - name: Run Python tests
        run: python -m pytest python/tests -q
      - name: Build wheel and sdist
        run: python -m build --outdir dist-python python
